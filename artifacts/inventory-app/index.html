<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>재고조사 앱</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <input id="barcodeInput" placeholder="바코드">
    <input id="quantityRef" placeholder="수량">

    <button onclick="handleSave()">저장</button>
    <button onclick="fileInputRef()">불러오기</button>

    <ul id="list"></ul>

    <script>
    function handleSave() {
      const data = {
        barcode: document.getElementById("barcodeInput").value,
        qty: document.getElementById("quantityRef").value
      };

      fetch("/save", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      }).then(() => alert("저장됨"));
    }
      function fileInputRef() {
        fetch("/load")
          .then(res => res.json())
          .then(data => {
            const list = document.getElementById("list");
            list.innerHTML = "";

            data.forEach(item => {
              const li = document.createElement("li");
              li.innerText = item.barcode + " / " + item.qty;
              list.appendChild(li);
            });
          });
      }
      </script>


    
  </body>
 
</html>
